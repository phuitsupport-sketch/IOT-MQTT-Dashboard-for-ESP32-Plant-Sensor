services:
  - type: web
    name: itserviecs
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py makemigrations && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn Scoplant.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
