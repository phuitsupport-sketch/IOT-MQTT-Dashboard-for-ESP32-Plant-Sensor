<!doctype html>
<html lang="vi">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Lỗi máy chủ</title>
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f3f6fb; color: #25324a; font: 16px/1.6 system-ui, sans-serif; }
		main { max-width: 560px; padding: 36px; border-radius: 16px; background: #fff; box-shadow: 0 12px 36px #1e293b18; }
		h1 { margin-top: 0; font-size: 1.5rem; }
	</style>
</head>
<body>
	<main>
		<h1>Máy chủ đang gặp sự cố</h1>
		<p>Ứng dụng tạm thời không thể xử lý yêu cầu. Hãy tải lại trang sau ít phút.</p>
	</main>
</body>
</html>
